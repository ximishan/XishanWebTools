<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片随机拼接</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#eef3f6;color:#24333f}.app{min-height:100vh;display:grid;grid-template-columns:370px 1fr}.panel{background:#fff;border-right:1px solid #d8e1e7;padding:20px;overflow:auto;max-height:100vh}.back{color:#5b7180;text-decoration:none;font-size:13px}h1{font-size:21px;margin:12px 0 5px}.sub,.hint{font-size:12px;color:#72808a;line-height:1.6}.g{margin:16px 0}.label{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#4d5d68;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.folders{display:grid;gap:8px}.folder{border:1px solid #d5dfe5;background:#f9fbfc;border-radius:11px;padding:9px}.folderline{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px}.folder input{margin-top:7px;width:100%}select,input[type=number],input[type=text]{width:100%;border:1px solid #cfd9df;border-radius:9px;padding:9px 10px;background:white;font:inherit}input[type=range]{width:100%}button{border:0;border-radius:10px;padding:11px 12px;font:inherit;font-weight:700;cursor:pointer;background:#e8f0f4;color:#294154}.primary{background:#284157;color:#fff}.buttons{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}.stage{display:flex;align-items:center;justify-content:center;padding:22px;overflow:auto}.frame{background:#dbe5ea;padding:12px;border-radius:16px;box-shadow:0 18px 40px rgba(30,50,65,.12)}canvas{display:block;max-width:min(72vw,760px);max-height:90vh;width:auto;height:auto;background:#dfe6ea}.val{font-size:12px;color:#7a8791}.status{font-size:12px;background:#f3f7f9;border-radius:9px;padding:9px 10px;color:#587080;line-height:1.55}@media(max-width:900px){.app{grid-template-columns:1fr}.panel{max-height:none;border-right:0;border-bottom:1px solid #d8e1e7}canvas{max-width:92vw;max-height:none}.buttons{grid-template-columns:1fr}}</style></head><body>
<div class="app"><aside class="panel"><a class="back" href="../../index.html">← 返回工具箱</a><h1>图片随机拼接</h1><div class="sub">支持 3 张 / 4 张图片，多个目录随机抽取，同一次生成不重复。图片仅在本地浏览器处理。</div>
<div class="g"><div class="label">素材目录</div><div class="folders">
<div class="folder"><div class="folderline"><b>目录 1</b><span id="n1">未选择</span></div><input id="f1" type="file" accept="image/*" webkitdirectory multiple></div>
<div class="folder"><div class="folderline"><b>目录 2</b><span id="n2">未选择</span></div><input id="f2" type="file" accept="image/*" webkitdirectory multiple></div>
<div class="folder"><div class="folderline"><b>目录 3</b><span id="n3">未选择</span></div><input id="f3" type="file" accept="image/*" webkitdirectory multiple></div>
<div class="folder" id="folder4"><div class="folderline"><b>目录 4</b><span id="n4">未选择</span></div><input id="f4" type="file" accept="image/*" webkitdirectory multiple></div>
</div></div>
<div class="g row"><div><div class="label">拼接图片数</div><select id="count"><option value="3">3 张</option><option value="4">4 张</option></select></div><div><div class="label">布局</div><select id="layout"><option value="vertical">纵向拼接</option><option value="grid">网格布局</option><option value="horizontal">横向拼接</option></select></div></div>
<div class="g row"><div><div class="label">生成数量</div><input id="batchCount" type="number" value="10" min="1" max="100"></div><div><div class="label">输出比例</div><select id="ratio"><option value="9:16">9:16（1080×1920）</option><option value="3:4" selected>3:4（1080×1440）</option><option value="16:9">16:9（1920×1080）</option><option value="1:1">1:1（1440×1440）</option><option value="custom">自定义</option></select></div></div>
<div class="g row" id="customRow" style="display:none"><div><div class="label">宽度</div><input id="cw" type="number" value="1080" min="200" max="5000"></div><div><div class="label">高度</div><input id="ch" type="number" value="1440" min="200" max="5000"></div></div>
<div class="g"><div class="label"><span>拼接缝虚化</span><span class="val" id="blurV"></span></div><input id="blur" type="range" min="0" max="40" value="10"></div>
<div class="g"><div class="label"><span>图片缩放</span><span class="val" id="zoomV"></span></div><input id="zoom" type="range" min="1" max="1.35" step=".01" value="1"></div>
<div class="g"><div class="label"><span>添加花字</span><span class="val">每张图不同样式</span></div><label style="display:flex;align-items:center;gap:8px;font-size:13px;color:#4d5d68"><input id="fancyText" type="checkbox" checked> 开启花字</label><input id="fancyWords" type="text" value="佑滑自取" maxlength="12" style="margin-top:8px;width:100%;border:1px solid #cfd9df;border-radius:9px;padding:9px 10px;background:white;font:inherit"><div class="hint" style="margin-top:6px">每张子图都会自动使用不同花字样式，并在文字后添加箭头。</div></div>
<div class="g"><div class="status" id="status">先选择至少 1 个素材目录，然后点击“随机生成”。如果目录数量不足，会从已选择目录的全部图片中补足。</div></div>
<div class="buttons"><button id="gen">随机生成预览</button><button id="save" class="primary">保存当前</button><button id="batch">批量生成下载</button></div>
</aside><main class="stage"><div class="frame"><canvas id="c" width="1080" height="1440"></canvas></div></main></div>
<script>
const $=id=>document.getElementById(id),c=$("c"),x=c.getContext("2d");const pools=[[],[],[],[]], history=[new Set(),new Set(),new Set(),new Set()];let lastFiles=[];
const isImg=f=>f.type.startsWith("image/")||/\.(png|jpe?g|webp|gif|bmp)$/i.test(f.name);function key(f){return[f.name,f.size,f.lastModified].join("|")}
for(let i=1;i<=4;i++)$("f"+i).addEventListener("change",e=>{pools[i-1]=[...e.target.files].filter(isImg);history[i-1].clear();$("n"+i).textContent=pools[i-1].length+" 张图片";updateStatus()});
function outSize(){let r=$("ratio").value;if(r==="9:16")return[1080,1920];if(r==="16:9")return[1920,1080];if(r==="1:1")return[1440,1440];if(r==="custom")return[Math.max(200,+$("cw").value||1080),Math.max(200,+$("ch").value||1440)];return[1080,1440]}
function pickFromPool(idx,used){let arr=pools[idx].filter(f=>!used.has(key(f)));if(!arr.length)return null;let fresh=arr.filter(f=>!history[idx].has(key(f)));if(!fresh.length){history[idx].clear();fresh=arr}let f=fresh[Math.floor(Math.random()*fresh.length)];history[idx].add(key(f));used.add(key(f));return f}
function chooseFiles(n){let used=new Set(),out=[];for(let i=0;i<Math.min(n,4);i++){if(pools[i].length){let f=pickFromPool(i,used);if(f)out.push(f)}}let all=pools.flat().filter(f=>!used.has(key(f)));while(out.length<n&&all.length){let j=Math.floor(Math.random()*all.length),f=all.splice(j,1)[0];used.add(key(f));out.push(f)}return out}
function loadImage(file){return new Promise((res,rej)=>{let im=new Image(),u=URL.createObjectURL(file);im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error(file.name))};im.src=u})}
function cells(n,layout,w,h){let a=[];if(layout==="horizontal"){for(let i=0;i<n;i++)a.push([i*w/n,0,w/n,h]);return a}if(layout==="grid"){if(n===3)return[[0,0,w/2,h/2],[w/2,0,w/2,h/2],[0,h/2,w,h/2]];return[[0,0,w/2,h/2],[w/2,0,w/2,h/2],[0,h/2,w/2,h/2],[w/2,h/2,w/2,h/2]]}for(let i=0;i<n;i++)a.push([0,i*h/n,w,h/n]);return a}
function drawCover(im,box,zoom){let[bx,by,bw,bh]=box,scale=Math.max(bw/im.width,bh/im.height)*zoom,sw=bw/scale,sh=bh/scale,sx=(im.width-sw)/2,sy=(im.height-sh)/2;x.drawImage(im,sx,sy,sw,sh,bx,by,bw,bh)}
function seamBlur(boxes,amount){if(amount<=0)return;let t=document.createElement("canvas");t.width=c.width;t.height=c.height;t.getContext("2d").drawImage(c,0,0);x.save();x.filter=`blur(${amount/2}px)`;for(let i=0;i<boxes.length-1;i++){let a=boxes[i],b=boxes[i+1];if(Math.abs(a[1]+a[3]-b[1])<2)x.drawImage(t,0,a[1]+a[3]-amount,c.width,amount*2,0,a[1]+a[3]-amount,c.width,amount*2);if(Math.abs(a[0]+a[2]-b[0])<2)x.drawImage(t,a[0]+a[2]-amount,0,amount*2,c.height,a[0]+a[2]-amount,0,amount*2,c.height)}x.restore();x.filter="none"}
const fancyStyles=[
{fill:"#fff45c",stroke:"#271a56",shadow:"#ff4d9d",font:"900",angle:-.055},
{fill:"#8ff6ff",stroke:"#092d4d",shadow:"#ffffff",font:"900",angle:.045},
{fill:"#ff9edf",stroke:"#4b164f",shadow:"#ffe75c",font:"900",angle:-.025},
{fill:"#ffffff",stroke:"#d92b3a",shadow:"#111111",font:"900",angle:.065},
{fill:"#b8ff7a",stroke:"#203b18",shadow:"#ffffff",font:"900",angle:-.04}
];
function drawFancyLabel(box,index,words){
  let[bx,by,bw,bh]=box,s=fancyStyles[index%fancyStyles.length],txt=(words||"佑滑自取")+" ➜";
  let size=Math.max(28,Math.min(bw*.13,bh*.16,112)),maxW=bw*.82;
  x.save();x.beginPath();x.rect(bx,by,bw,bh);x.clip();
  x.translate(bx+bw/2,by+bh*.72);x.rotate(s.angle);
  x.textAlign="center";x.textBaseline="middle";x.lineJoin="round";
  x.font=`${s.font} ${size}px "Microsoft YaHei","PingFang SC","Arial Black",sans-serif`;
  let measured=x.measureText(txt).width;if(measured>maxW){size*=maxW/measured;x.font=`${s.font} ${size}px "Microsoft YaHei","PingFang SC","Arial Black",sans-serif`}
  x.shadowColor="rgba(0,0,0,.35)";x.shadowBlur=Math.max(5,size*.08);x.shadowOffsetY=Math.max(3,size*.04);
  x.lineWidth=Math.max(5,size*.12);x.strokeStyle=s.stroke;x.strokeText(txt,0,0);
  x.shadowColor=s.shadow;x.shadowBlur=Math.max(7,size*.12);x.shadowOffsetY=0;
  x.fillStyle=s.fill;x.fillText(txt,0,0);
  x.restore();
}
async function renderOnce(files){let[w,h]=outSize();c.width=w;c.height=h;x.fillStyle="#111";x.fillRect(0,0,w,h);let ims=await Promise.all(files.map(loadImage)),bs=cells(files.length,$("layout").value,w,h),z=+$("zoom").value;ims.forEach((im,i)=>drawCover(im,bs[i],z));seamBlur(bs,+$("blur").value);if($("fancyText").checked)bs.forEach((b,i)=>drawFancyLabel(b,i,$("fancyWords").value.trim()||"佑滑自取"));lastFiles=files;return files}
async function generate(){let n=+$("count").value,files=chooseFiles(n);if(files.length<n){$("status").textContent=`素材不足：需要 ${n} 张，目前能选到 ${files.length} 张。请再添加目录或图片。`;return}await renderOnce(files);$("status").textContent="本次随机："+files.map(f=>f.name).join(" ｜ ")}
function updateStatus(){let total=pools.reduce((s,p)=>s+p.length,0);$("status").textContent=`已加载 ${total} 张图片。随机时同一张图片不会在同一张拼接图里重复。批量下载时请允许浏览器多文件下载。`}
function canvasToBlob(type="image/jpeg",quality=.94){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("导出失败")),type,quality))}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
async function saveCurrent(){if(!lastFiles.length){await generate();if(!lastFiles.length)return}let blob=await canvasToBlob();downloadBlob(blob,"随机拼接_"+Date.now()+".jpg");$("status").textContent="已保存当前预览图片。"}
async function batchGenerate(){let total=Math.min(100,Math.max(1,+$("batchCount").value||1)),n=+$("count").value;$("batchCount").value=total;for(let i=0;i<total;i++){let files=chooseFiles(n);if(files.length<n){$("status").textContent=`素材不足：需要 ${n} 张，目前能选到 ${files.length} 张。请再添加目录或图片。`;return}await renderOnce(files);let blob=await canvasToBlob();let idx=String(i+1).padStart(String(total).length,"0");downloadBlob(blob,`随机拼接_${idx}_${Date.now()}.jpg`);$("status").textContent=`正在批量生成：第 ${i+1} / ${total} 张`;await sleep(180)}$("status").textContent=`批量生成完成，共下载 ${total} 张图片。浏览器若拦截下载，请允许当前站点多文件下载。`}
$("ratio").onchange=()=>{$("customRow").style.display=$("ratio").value==="custom"?"grid":"none"};$("count").onchange=()=>{$("folder4").style.opacity=$("count").value==="4"?"1":".55"};
$("blur").oninput=()=>$("blurV").textContent=$("blur").value+" px";$("zoom").oninput=()=>$("zoomV").textContent=Number($("zoom").value).toFixed(2)+"×";$("blur").oninput();$("zoom").oninput();
$("gen").onclick=()=>generate().catch(e=>$("status").textContent="生成失败："+e.message);$("save").onclick=()=>saveCurrent().catch(e=>$("status").textContent="保存失败："+e.message);$("batch").onclick=()=>batchGenerate().catch(e=>$("status").textContent="批量生成失败："+e.message);
</script></body></html>
